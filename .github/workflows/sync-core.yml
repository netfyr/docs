name: Update from core

on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-core
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.source.outputs.changed }}
      revision: ${{ steps.source.outputs.revision }}
      base: ${{ steps.source.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netfyr/netfyr
          ref: main
          path: .cache/core
          persist-credentials: false
      - name: Check for an update
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(git -C .cache/core rev-parse HEAD)
          current=$(python3 -c 'import json; print(json.load(open("core-ref.json"))["revision"])')
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "Core reference is current."
            exit 0
          fi
          pending=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("docs/core-"))] | length')
          previous=$(gh pr list --state all --head "docs/core-$latest" --json number --jq 'length')
          if [ "$pending" -ne 0 ] || [ "$previous" -ne 0 ]; then
            echo "An update is awaiting review, or this revision was already proposed."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.source.outputs.changed == 'true'
        with:
          python-version: "3.13"
      - name: Install dependencies
        if: steps.source.outputs.changed == 'true'
        run: |
          python -m pip install --require-hashes -r requirements.txt
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Generate and validate update
        if: steps.source.outputs.changed == 'true'
        env:
          CORE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          python scripts/sync_core.py --revision "$CORE_REVISION"
          cargo update --manifest-path checks/examples/Cargo.toml -p netfyr-policy -p netfyr-state
          python -m unittest discover -s tests -v
          python scripts/sync_core.py --check
          cargo test --locked --manifest-path checks/examples/Cargo.toml
          mkdocs build --strict
      - name: Upload validated reference
        if: steps.source.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-update
          retention-days: 7
          if-no-files-found: error
          path: |
            core-ref.json
            docs/reference/fields.md
            docs/reference/schemas/*.json
            checks/examples/Cargo.toml
            checks/examples/Cargo.lock

  propose:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-update
          path: ${{ runner.temp }}/core-update
      - name: Prepare update files
        env:
          CORE_REVISION: ${{ needs.candidate.outputs.revision }}
        run: |
          python3 scripts/prepare_sync_pr.py --candidate "$RUNNER_TEMP/core-update" \
            --revision "$CORE_REVISION" --body-file "$RUNNER_TEMP/core-update.md"
      - name: Open update PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORE_REVISION: ${{ needs.candidate.outputs.revision }}
          DOCS_BASE: ${{ needs.candidate.outputs.base }}
        run: |
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$DOCS_BASE" ]; then
            echo "Docs main changed during validation. Run this workflow again."
            exit 1
          fi
          branch="docs/core-$CORE_REVISION"
          if [ "$(gh pr list --state all --head "$branch" --json number --jq 'length')" -ne 0 ]; then
            echo "This core revision already has a PR."
            exit 0
          fi
          git switch -c "$branch"
          git add core-ref.json docs/reference/fields.md docs/reference/schemas checks/examples/Cargo.toml checks/examples/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update configuration reference from core ${CORE_REVISION:0:12}"
          gh auth setup-git
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "refs/heads/$branch"
            git diff --exit-code HEAD FETCH_HEAD
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          gh pr create --base main --head "$branch" \
            --title "Update configuration reference from core ${CORE_REVISION:0:12}" \
            --body-file "$RUNNER_TEMP/core-update.md"
