name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read core revision
        id: core
        run: |
          python3 -c 'import json; from pathlib import Path; import sys; sys.path.insert(0, "scripts"); from sync_core import revision; print("revision=" + revision(json.loads(Path("core-ref.json").read_text())["revision"]))' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netfyr/netfyr
          ref: ${{ steps.core.outputs.revision }}
          path: .cache/core
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check reference and examples
        run: |
          python -m unittest discover -s tests -v
          python scripts/sync_core.py --check
          cargo test --locked --manifest-path checks/examples/Cargo.toml
      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build site
        env:
          NETFYR_SITE_URL: ${{ steps.pages.outputs.base_url || 'https://docs.netfyr.io/' }}
        run: mkdocs build --strict
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
