site_name: netfyr
site_description: Configure Linux networking with netfyr.
site_url: !ENV [NETFYR_SITE_URL, "https://docs.netfyr.io/"]
repo_name: netfyr/docs
repo_url: https://github.com/netfyr/docs
edit_uri: edit/main/docs/
copyright: Copyright © 2026 The netfyr authors

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/netfyr-logo-paper.svg
  favicon: assets/images/netfyr-mark-orange.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration:
      - Policies: configuration/policies.md
      - IPv4: configuration/ipv4.md
      - Providers: configuration/providers.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - State fields: reference/fields.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [examples]
      check_paths: true
      restrict_base_path: true
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

extra_css:
  - assets/stylesheets/netfyr.css

extra:
  generator: false
